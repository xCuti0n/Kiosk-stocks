<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b5e20">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Tindahan Stock Tracker</title>
</head>
<body>
<div id="login" class="screen">
  <h1>🏪 Tindahan Tracker</h1>
  <p>Who is using the app?</p>
  <button data-role="owner" class="big">👤 Owner</button>
  <button data-role="keeper" class="big alt">👤 Shop keeper</button>
  <form id="pinForm" hidden>
    <label>Your PIN (numbers)<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <button class="big">Enter</button>
    <p id="pinHint" class="note"></p>
  </form>
  <div class="fs"><span>Text size:</span>
    <button id="fsDownL" class="alt" aria-label="Smaller text" onclick="document.getElementById('fsDown').click()">A−</button>
    <button id="fsUpL" class="alt" aria-label="Bigger text" onclick="document.getElementById('fsUp').click()">A+</button></div>
</div>

<div id="app" hidden>
  <header>
    <span id="who"></span>
    <span class="hbtns">
      <button id="fsDown" class="hb" aria-label="Smaller text">A−</button>
      <button id="fsUp" class="hb" aria-label="Bigger text">A+</button>
      <button id="logout" class="hb">Log out</button>
    </span>
  </header>
  <div id="alerts"></div>
  <main id="view"></main>
  <nav>
    <button data-tab="sell"><span>🛒</span>Sell</button>
    <button data-tab="inventory"><span>📦</span>Stock</button>
    <button data-tab="report"><span>📊</span>Reports</button>
  </nav>
</div>

<div id="toast" hidden role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
